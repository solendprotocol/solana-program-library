[package]
name = "solend-program"
version.workspace = true
description = "Solend Program"
authors = ["Solend Maintainers <maintainers@solend.fi>"]
repository = "https://github.com/solendprotocol/solana-program-library"
license = "Apache-2.0"
edition = "2018"

[features]
custom-heap = []
custom-panic = []
no-entrypoint = []
test-bpf = []

[dependencies]
bytemuck = "1.5.1"
oracles = { path = "../oracles" }
solana-program = "=1.16.20"
solend-sdk = { path = "../sdk" }
spl-associated-token-account = "1.0.5"                          # compatible with spl-token 3.3.0
spl-token = { version = "3.3.0", features = ["no-entrypoint"] }
static_assertions = "1.1.0"

[dev-dependencies]
anchor-lang = "0.28.0"
assert_matches = "1.5.0"
base64 = "0.13"
bincode = "1.3.3"
borsh = "0.10.3"
bytemuck = "1.5.1"
log = "0.4.14"
pretty_assertions = "1.4.1"
proptest = "1.0"
pyth-sdk-solana = "0.8.0"
pyth-solana-receiver-sdk = "0.3.0"
serde = ">=1.0.140"
serde_yaml = "0.8"
solana-program-test = "=1.16.20"
solana-sdk = "=1.16.20"
switchboard-on-demand = "0.1.12"
switchboard-program = "0.2.0"
switchboard-v2 = "0.1.3"
thiserror = "1.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "solend_program"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
