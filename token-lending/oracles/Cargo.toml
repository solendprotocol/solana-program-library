[package]
name = "oracles"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pyth-sdk-solana = "0.10.6"
pyth-solana-receiver-sdk = "1.0.0"
solana-program = "^2"
anchor-lang = "0.31.1"
solend-sdk = { path = "../sdk" }
switchboard-on-demand = "0.10.8"
# switchboard-v2 will be overridden by rust-liquidator workspace to use a fork with anchor 0.31.x
# When building standalone, you'll need a [patch] section or workspace override
switchboard-v2 = "0.4.0"

[dev-dependencies]
bytemuck = "1.5.1"
assert_matches = "1.5.0"
base64 = "0.21"
log = "0.4.14"
proptest = "1.0"
solana-sdk = "^2"
serde = "1.0.140"
serde_yaml = "0.9"
rand = "0.8.5"
